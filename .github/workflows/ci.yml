name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test --coverage

  build-android:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release --dart-define=APTABASE_APP_KEY=${{ secrets.APTABASE_APP_KEY }}
      - run: flutter build appbundle --release --dart-define=APTABASE_APP_KEY=${{ secrets.APTABASE_APP_KEY }}
      - uses: actions/upload-artifact@v7
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
      - uses: actions/upload-artifact@v7
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14

  build-linux:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build linux --release --dart-define=APTABASE_APP_KEY=${{ secrets.APTABASE_APP_KEY }}
      - run: tar -C build/linux/x64/release -czf simplex-blender-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v7
        with:
          name: simplex-blender-linux-x64.tar.gz
          path: simplex-blender-linux-x64.tar.gz
          retention-days: 14

  build-windows:
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release --dart-define=APTABASE_APP_KEY=${{ secrets.APTABASE_APP_KEY }}
      - run: Compress-Archive build/windows/x64/runner/Release simplex-blender-windows-x64.zip
      - uses: actions/upload-artifact@v7
        with:
          name: simplex-blender-windows-x64.zip
          path: simplex-blender-windows-x64.zip
          retention-days: 14

  build-macos:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build macos --release --dart-define=APTABASE_APP_KEY=${{ secrets.APTABASE_APP_KEY }}
      - run: ditto -c -k --keepParent build/macos/Build/Products/Release/simplex_blender.app simplex-blender-macos.zip
      - uses: actions/upload-artifact@v7
        with:
          name: simplex-blender-macos.zip
          path: simplex-blender-macos.zip
          retention-days: 14

  build-ios:
    runs-on: macos-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: .flutter-version
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign --dart-define=APTABASE_APP_KEY=${{ secrets.APTABASE_APP_KEY }}
      - run: mkdir Payload && cp -R build/ios/iphoneos/Runner.app Payload/ && zip -r simplex-blender-ios-universal-unsigned.ipa Payload
      - uses: actions/upload-artifact@v7
        with:
          name: simplex-blender-ios-universal-unsigned.ipa
          path: simplex-blender-ios-universal-unsigned.ipa
          retention-days: 14
